<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会場探索クイズ</title>

<style>
    /* ================================
       基本設定
    ================================= */
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Hiragino Kaku Gothic ProN",
            "Yu Gothic",
            "Meiryo",
            sans-serif;
        color: #4f463e;
        background:
            radial-gradient(circle at top, #fffdf9 0%, #faf7f1 55%, #f5f0e8 100%);
        line-height: 1.8;
    }

    button,
    input {
        font: inherit;
    }

    button {
        -webkit-tap-highlight-color: transparent;
    }

    /* ================================
       画面共通
    ================================= */
    .screen {
        display: none;
        min-height: 100vh;
        padding: 28px 18px 40px;
        animation: fadeIn 0.45s ease;
    }

    .screen.active {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
    }

    .card {
        width: 100%;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(190, 155, 82, 0.25);
        border-radius: 24px;
        padding: 30px 22px;
        box-shadow:
            0 12px 35px rgba(100, 75, 35, 0.09),
            0 2px 8px rgba(100, 75, 35, 0.05);
    }

    /* ================================
       共通タイトル
    ================================= */
    .eyebrow {
        text-align: center;
        color: #ad8950;
        font-size: 0.78rem;
        letter-spacing: 0.22em;
        margin-bottom: 8px;
    }

    h1,
    h2 {
        margin: 0;
        font-weight: 600;
        letter-spacing: 0.04em;
    }

    .gold-line {
        width: 55px;
        height: 1px;
        background: linear-gradient(
            90deg,
            transparent,
            #c7a15a,
            transparent
        );
        margin: 16px auto 22px;
    }

    /* ================================
       ① 注意・案内画面
    ================================= */
    .notice-card {
        text-align: center;
        padding-top: 34px;
        padding-bottom: 30px;
    }

    .notice-icon {
        width: 58px;
        height: 58px;
        margin: 0 auto 16px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf5e9;
        border: 1px solid rgba(190, 155, 82, 0.35);
        font-size: 1.65rem;
        box-shadow: 0 5px 18px rgba(120, 90, 35, 0.08);
    }

    .notice-title {
        font-size: clamp(1.45rem, 6vw, 1.9rem);
        color: #55483b;
    }

    .notice-description {
        margin: 0 auto 24px;
        font-size: 0.95rem;
        color: #655b52;
        text-align: left;
    }

    /* 注意事項を独立して目立たせるカード */
    .attention-box {
        margin: 22px 0 28px;
        padding: 21px 18px;
        text-align: left;
        background: linear-gradient(
            135deg,
            #fffaf0,
            #f8f0df
        );
        border: 1px solid rgba(184, 145, 68, 0.55);
        border-radius: 18px;
        box-shadow:
            0 8px 22px rgba(130, 95, 35, 0.10),
            inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .attention-label {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 9px;
        color: #8f6d32;
        font-size: 0.95rem;
        font-weight: 700;
    }

    .attention-text {
        margin: 0;
        color: #51483e;
        font-size: 0.95rem;
        font-weight: 700;
        line-height: 1.9;
    }

    .attention-important {
        display: block;
        margin-bottom: 8px;
        color: #7d6030;
        font-size: 1rem;
        font-weight: 700;
    }

    /* ================================
       ② タイトル画面
    ================================= */
    .title-card {
        position: relative;
        overflow: hidden;
        text-align: center;
        padding: 42px 22px 34px;
        border: 1px solid rgba(190, 155, 82, 0.38);
        box-shadow:
            0 18px 45px rgba(100, 75, 35, 0.13),
            0 3px 12px rgba(100, 75, 35, 0.06);
    }

    /* タイトル画面だけ少し華やかにする装飾 */
    .title-card::before,
    .title-card::after {
        content: "";
        position: absolute;
        width: 110px;
        height: 110px;
        border: 1px solid rgba(190, 155, 82, 0.16);
        border-radius: 50%;
        pointer-events: none;
    }

    .title-card::before {
        top: -72px;
        left: -72px;
    }

    .title-card::after {
        right: -72px;
        bottom: -72px;
    }

    .title-decoration {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 13px;
        color: #c29b52;
    }

    .title-decoration::before,
    .title-decoration::after {
        content: "";
        width: 48px;
        height: 1px;
        background: linear-gradient(
            90deg,
            transparent,
            #c29b52
        );
    }

    .title-decoration::after {
        background: linear-gradient(
            90deg,
            #c29b52,
            transparent
        );
    }

    .title-jewel {
        font-size: 1.15rem;
        animation: gentleFloat 2.8s ease-in-out infinite;
    }

    .main-title {
        position: relative;
        font-size: clamp(2rem, 9vw, 3rem);
        line-height: 1.3;
        color: #4e4338;
        letter-spacing: 0.08em;
        text-shadow: 0 1px 0 #fff;
    }

    .title-subline {
        width: 80px;
        height: 2px;
        margin: 17px auto 22px;
        background: linear-gradient(
            90deg,
            transparent,
            #c8a15a,
            transparent
        );
    }

    .title-description {
        position: relative;
        margin: 0 auto;
        color: #655b52;
        font-size: 0.95rem;
        line-height: 2;
    }

    .title-highlight {
        margin: 20px 0 26px;
        padding: 13px 15px;
        border-radius: 14px;
        background: #fcfaf5;
        border: 1px solid rgba(190, 155, 82, 0.18);
        color: #806536;
        font-size: 0.86rem;
    }

    /* ================================
       ボタン
    ================================= */
    .primary-button {
        width: 100%;
        min-height: 56px;
        border: none;
        border-radius: 17px;
        background: linear-gradient(
            135deg,
            #c8a45e,
            #ad8544
        );
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.08em;
        box-shadow:
            0 7px 16px rgba(145, 105, 40, 0.22),
            inset 0 1px 0 rgba(255,255,255,0.35);
        cursor: pointer;
        transition:
            transform 0.18s ease,
            box-shadow 0.18s ease,
            opacity 0.18s ease;
    }

    .primary-button:hover {
        transform: translateY(-2px);
        box-shadow:
            0 10px 20px rgba(145, 105, 40, 0.25),
            inset 0 1px 0 rgba(255,255,255,0.35);
    }

    .primary-button:active {
        transform: translateY(1px);
    }

    .secondary-button {
        width: 100%;
        min-height: 54px;
        margin-top: 14px;
        border: 1px solid rgba(190, 155, 82, 0.42);
        border-radius: 16px;
        background: #fffdf9;
        color: #856b3e;
        font-weight: 700;
        cursor: pointer;
    }

    /* ================================
       ③ クイズ画面
    ================================= */
    .quiz-card {
        padding: 22px 20px 26px;
    }

    .progress-area {
        margin-bottom: 23px;
    }

    .question-number {
        text-align: center;
        font-size: 0.84rem;
        color: #967742;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-bottom: 9px;
    }

    .progress-track {
        width: 100%;
        height: 7px;
        background: #eee8dd;
        border-radius: 999px;
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        width: 0;
        background: linear-gradient(
            90deg,
            #d2b06d,
            #ad8544
        );
        border-radius: 999px;
        transition: width 0.35s ease;
    }

    .question-text {
        margin: 0 0 16px;
        text-align: left;
        font-size: clamp(1.15rem, 5vw, 1.4rem);
        line-height: 1.65;
        color: #4f463e;
        font-weight: 700;
    }

    /* ヒントは問題文の直下に配置 */
    .hint-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        margin: 0 0 18px;
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid rgba(190, 155, 82, 0.42);
        background: #fffaf0;
        color: #8b6d38;
        font-size: 0.85rem;
        font-weight: 700;
        cursor: pointer;
    }

    .hint-box {
        display: none;
        margin: -4px 0 18px;
        padding: 13px 15px;
        border-radius: 13px;
        background: #fbf8f2;
        border-left: 3px solid #c7a15a;
        color: #665a4d;
        font-size: 0.88rem;
        text-align: left;
    }

    .hint-box.show {
        display: block;
        animation: fadeIn 0.25s ease;
    }

    .choices {
        display: grid;
        gap: 11px;
    }

    .choice-button {
        width: 100%;
        min-height: 56px;
        padding: 12px 15px;
        border: 1px solid #e2d8c9;
        border-radius: 15px;
        background: #fff;
        color: #514940;
        text-align: left;
        font-weight: 600;
        cursor: pointer;
        transition:
            background 0.18s ease,
            border-color 0.18s ease,
            transform 0.18s ease;
    }

    .choice-button:hover {
        background: #fcfaf5;
        border-color: #c9aa70;
    }

    .choice-button:active {
        transform: scale(0.99);
    }

    .choice-button:disabled {
        cursor: default;
        opacity: 0.95;
    }

    .input-area {
        display: none;
    }

    .answer-input {
        width: 100%;
        min-height: 58px;
        padding: 12px 16px;
        border: 1px solid #dcd0c0;
        border-radius: 15px;
        outline: none;
        color: #4f463e;
        background: #fff;
    }

    .answer-input:focus {
        border-color: #bd9958;
        box-shadow: 0 0 0 3px rgba(189, 153, 88, 0.12);
    }

    .submit-input-button {
        width: 100%;
        min-height: 54px;
        margin-top: 12px;
        border: none;
        border-radius: 15px;
        background: #b28a48;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
    }

    /* ================================
       正解・不正解後
       表示順：
       ①正誤
       ②画像
       ③解説
       ④次へ
    ================================= */
    .answer-result {
        display: none;
        margin-top: 22px;
        padding-top: 22px;
        border-top: 1px solid #eee6da;
        text-align: center;
        animation: fadeIn 0.35s ease;
    }

    .result-status {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 18px;
    }

    .result-status.correct {
        color: #9b793d;
    }

    .result-status.incorrect {
        color: #8b6558;
    }

    .answer-image {
        display: none;
        width: 100%;
        max-width: 450px;
        height: auto;
        aspect-ratio: 4 / 3;
        margin: 0 auto 20px;
        object-fit: cover;
        border-radius: 17px;
        box-shadow:
            0 8px 22px rgba(90, 65, 30, 0.13);
    }

    .explanation {
        margin: 0 auto 22px;
        text-align: left;
        color: #5c534b;
        font-size: 0.93rem;
        line-height: 1.9;
        white-space: pre-line;
    }

    .next-button {
        width: 100%;
        min-height: 55px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(
            135deg,
            #c8a45e,
            #ad8544
        );
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 7px 15px rgba(145, 105, 40, 0.18);
    }

    /* ================================
       ④ 結果画面
    ================================= */
    .result-card {
        text-align: center;
        padding: 32px 21px;
    }

    .result-title {
        font-size: 1.7rem;
        color: #55483b;
        margin-bottom: 20px;
    }

    .final-score {
        font-size: 1.05rem;
        color: #806536;
        margin-bottom: 18px;
    }

    .score-number {
        font-size: 2.2rem;
        font-weight: 700;
        color: #a17c3e;
    }

    .special-image {
        display: none;
        width: 100%;
        max-width: 500px;
        height: auto;
        margin: 8px auto 24px;
        border-radius: 18px;
        box-shadow:
            0 10px 25px rgba(90, 65, 30, 0.14);
    }

    .result-message {
        margin: 0 0 27px;
        text-align: left;
        white-space: pre-line;
        color: #5b5148;
        font-size: 0.94rem;
        line-height: 2;
    }

    /* ================================
       アニメーション
    ================================= */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(8px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes gentleFloat {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-4px);
        }
    }

    /* ================================
       スマートフォン向け微調整
    ================================= */
    @media (max-width: 480px) {
        .screen {
            padding: 18px 13px 28px;
        }

        .card {
            border-radius: 21px;
            padding-left: 18px;
            padding-right: 18px;
        }

        .notice-card {
            padding-top: 28px;
        }

        .title-card {
            padding: 34px 18px 28px;
        }

        .main-title {
            font-size: 2.05rem;
        }

        .question-text {
            font-size: 1.13rem;
        }

        .choice-button {
            min-height: 58px;
        }
    }
</style>
</head>

<body>

<!-- =================================
     ① 注意・案内画面
================================= -->
<section id="noticeScreen" class="screen active">
    <div class="container">
        <div class="card notice-card">

            <!-- ゲーム開始前の確認画面。タイトル画面とは役割を分け、ここでは注意事項に集中できる構成にする。 -->
            <div class="notice-icon">✦</div>

            <div class="eyebrow">GAME GUIDE</div>

            <h1 class="notice-title">ゲームを始める前に</h1>

            <div class="gold-line"></div>

            <p class="notice-description">
                このクイズは、披露宴会場内に散りばめられたヒントを探しながら楽しむ「会場探索クイズ」です。
            </p>

            <!-- 最重要事項を独立したカードにして、本文より目立たせる。 -->
            <div class="attention-box">
                <div class="attention-label">
                    <span>📍</span>
                    <span>PLAY POINT</span>
                </div>

                <p class="attention-text">
                    <span class="attention-important">会場に到着してから挑戦してください！</span>
                    答えを先に知ってしまうと、会場探索の楽しみが半減してしまいます。
                </p>
            </div>

            <button id="arrivedButton" class="primary-button">
                ✅ 会場に到着しました
            </button>

        </div>
    </div>
</section>


<!-- =================================
     ② タイトル画面
================================= -->
<section id="titleScreen" class="screen">
    <div class="container">
        <div class="card title-card">

            <div class="title-decoration">
                <span class="title-jewel">✦</span>
            </div>

            <div class="eyebrow">WEDDING VENUE QUEST</div>

            <h1 class="main-title">会場探索クイズ</h1>

            <div class="title-subline"></div>

            <p class="title-description">
                会場内に散りばめられたヒントを探しながら、<br>
                二人の好きなものや思い出を<br>
                見つけてみてください。
            </p>

            <div class="title-highlight">
                全10問の会場探索クイズです。<br>
                全問正解を目指しましょう！<br><br>
                全問正解すると特別な画像が見られるかも？
            </div>

            <button id="startButton" class="primary-button">
                クイズを始める
            </button>

        </div>
    </div>
</section>


<!-- =================================
     ③ クイズ画面
================================= -->
<section id="quizScreen" class="screen">
    <div class="container">
        <div class="card quiz-card">

            <div class="progress-area">
                <div id="questionNumber" class="question-number">
                    Q1 / 10
                </div>

                <div class="progress-track">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
            </div>

            <div id="questionText" class="question-text"></div>

            <!-- ヒントは問題文の直下に配置 -->
            <button id="hintButton" class="hint-button">
                💡 ヒントを見る
            </button>

            <div id="hintBox" class="hint-box"></div>

            <!-- 4択 -->
            <div id="choices" class="choices"></div>

            <!-- Q9用入力 -->
            <div id="inputArea" class="input-area">
                <input
                    id="answerInput"
                    class="answer-input"
                    type="text"
                    placeholder="答えを入力してください"
                    autocomplete="off"
                    spellcheck="false"
                >

                <button id="submitInputButton" class="submit-input-button">
                    回答する
                </button>
            </div>

            <!--
                回答後の表示順
                ① 正解／不正解
                ② 問題に対応した画像
                ③ 解説
                ④ 次へボタン
            -->
            <div id="answerResult" class="answer-result">

                <div id="resultStatus" class="result-status"></div>

                <img
                    id="answerImage"
                    class="answer-image"
                    alt="問題の画像"
                >

                <p id="explanation" class="explanation"></p>

                <button id="nextButton" class="next-button">
                    次へ
                </button>

            </div>

        </div>
    </div>
</section>


<!-- =================================
     ④ 結果画面
================================= -->
<section id="resultScreen" class="screen">
    <div class="container">
        <div class="card result-card">

            <div class="eyebrow">RESULT</div>

            <h2 id="resultTitle" class="result-title"></h2>

            <div class="gold-line"></div>

            <div class="final-score">
                正解数
                <div>
                    <span id="scoreNumber" class="score-number">0</span>
                    <span> / 10</span>
                </div>
            </div>

            <!-- 10問正解時のみ表示 -->
            <img
                id="specialImage"
                class="special-image"
                src="special.png"
                alt="コンプリート達成"
            >

            <p id="resultMessage" class="result-message"></p>

            <button id="retryButton" class="primary-button">
                もう一度遊ぶ
            </button>

        </div>
    </div>
</section>


<script>
/* ==========================================
   クイズデータ
   問題文・選択肢・ヒント・解説をまとめて管理
========================================== */

const quizData = [
    {
        question: "席札に使われているテーマは？",
        choices: [
            "花",
            "ディズニーとポケモン",
            "動物",
            "映画"
        ],
        answer: "ディズニーとポケモン",
        displayAnswer: "ディズニーとポケモン",
        hint: "席札や座席表を見ると分かるかも？",
        explanation:
            "新郎側にはポケモン、新婦側にはディズニーのキャラクターが使われています",
        image: "question1.jpg"
    },

    {
        question: "キャラクター選定の共通ルールは？",
        choices: [
            "人気順",
            "誕生日順",
            "アルファベットの頭文字",
            "ランダム"
        ],
        answer: "アルファベットの頭文字",
        displayAnswer: "アルファベットの頭文字",
        hint: "座席表で法則性を見つけよう",
        explanation:
            "AテーブルならAriel、GテーブルならGonbe（ゴンベ）のように、テーブル名とキャラクター名の頭文字を合わせています",
        image: "question2.jpg"
    },

    {
        question: "ウェルカムボードに使われているパズルの作品は？",
        choices: [
            "シンデレラ",
            "ラプンツェル",
            "ベイマックス",
            "モアナ"
        ],
        answer: "ラプンツェル",
        displayAnswer: "ラプンツェル",
        hint: "ウェルカムボードは受付近くにあるよ",
        explanation:
            "新婦が作成したディズニーパズルをウェルカムボードとして使用しています",
        image: "question3.jpg"
    },

    {
        question: "テーブルランナーの色味のテーマは？",
        choices: [
            "ティファニー",
            "海",
            "空",
            "ポッチャマ"
        ],

        // 選択肢は「ティファニー」。
        // 判定も「ティファニー」を使用する。
        // 正解表示だけ「ティファニーブルー」とする。
        answer: "ティファニー",
        displayAnswer: "ティファニーブルー",

        hint: "新郎新婦が身に着けているものに関係あるかも？",
        explanation:
            "テーブルランナーには結婚指輪と同じティファニーブルーを取り入れています",
        image: "question4.jpg"
    },

    {
        question: "受付に飾られているピカチュウはどんな姿でしょう？",
        choices: [
            "ラーメンを持っている",
            "探検隊",
            "新郎新婦",
            "七夕まつりごっこ"
        ],
        answer: "新郎新婦",
        displayAnswer: "新郎新婦",
        hint: "受付の真ん中にいたような",
        explanation:
            "受付では新郎新婦姿のピカチュウがお出迎えしています",
        image: "question5.jpg"
    },

    {

/* ==========================================
   状態管理
========================================== */

let currentQuestion = 0;
let score = 0;
let answered = false;


/* ==========================================
   DOM取得
========================================== */

const noticeScreen = document.getElementById("noticeScreen");
const titleScreen = document.getElementById("titleScreen");
const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("resultScreen");

const arrivedButton = document.getElementById("arrivedButton");
const startButton = document.getElementById("startButton");

const questionNumber = document.getElementById("questionNumber");
const progressBar = document.getElementById("progressBar");
const questionText = document.getElementById("questionText");

const hintButton = document.getElementById("hintButton");
const hintBox = document.getElementById("hintBox");

const choices = document.getElementById("choices");
const inputArea = document.getElementById("inputArea");
const answerInput = document.getElementById("answerInput");
const submitInputButton = document.getElementById("submitInputButton");

const answerResult = document.getElementById("answerResult");
const resultStatus = document.getElementById("resultStatus");
const answerImage = document.getElementById("answerImage");
const explanation = document.getElementById("explanation");
const nextButton = document.getElementById("nextButton");

const resultTitle = document.getElementById("resultTitle");
const scoreNumber = document.getElementById("scoreNumber");
const specialImage = document.getElementById("specialImage");
const resultMessage = document.getElementById("resultMessage");
const retryButton = document.getElementById("retryButton");


/* ==========================================
   画面切り替え
========================================== */

function showScreen(screen) {
    [noticeScreen, titleScreen, quizScreen, resultScreen].forEach(function(item) {
        item.classList.remove("active");
    });

    screen.classList.add("active");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* ==========================================
   注意画面 → タイトル画面
========================================== */

arrivedButton.addEventListener("click", function() {
    showScreen(titleScreen);
});


/* ==========================================
   タイトル画面 → クイズ開始
========================================== */

startButton.addEventListener("click", function() {
    currentQuestion = 0;
    score = 0;
    showScreen(quizScreen);
    displayQuestion();
});


/* ==========================================
   問題表示
========================================== */

function displayQuestion() {

    answered = false;

    const data = quizData[currentQuestion];

    questionNumber.textContent =
        "Q" + (currentQuestion + 1) + " / " + quizData.length;

    progressBar.style.width =
        ((currentQuestion + 1) / quizData.length * 100) + "%";

    questionText.textContent = data.question;

    hintBox.textContent = data.hint;
    hintBox.classList.remove("show");

    choices.innerHTML = "";

    inputArea.style.display = "none";
    answerResult.style.display = "none";

    /*
       前の問題の回答後にQ9へ進んだ場合でも、
       入力欄と回答ボタンがdisabledのまま残らないように
       毎回問題表示時に再有効化する。
    */
    answerInput.value = "";
    answerInput.disabled = false;
    submitInputButton.disabled = false;

    /* Q9だけ入力式、それ以外は4択 */
    if (data.type === "input") {

        choices.style.display = "none";
        inputArea.style.display = "block";

        setTimeout(function() {
            answerInput.focus();
        }, 100);

    } else {

        choices.style.display = "grid";

        data.choices.forEach(function(choice) {

            const button = document.createElement("button");

            button.className = "choice-button";
            button.textContent = choice;

            button.addEventListener("click", function() {
                checkChoiceAnswer(choice);
            });

            choices.appendChild(button);
        });
    }
}


/* ==========================================
   ヒント表示
   回答前でも回答後でも表示可能
========================================== */

hintButton.addEventListener("click", function() {
    hintBox.classList.toggle("show");
});


/* ==========================================
   4択の回答判定
========================================== */

function checkChoiceAnswer(selectedAnswer) {

    if (answered) {
        return;
    }

    const data = quizData[currentQuestion];

    const isCorrect = selectedAnswer === data.answer;

    finishAnswer(isCorrect, data);
}


/* ==========================================
   Q9の入力判定
========================================== */

/*
    「Will you marry me?」を入力しようとしていることが
    分かれば正解とするため、軽微なスペルミスを許容する。

    ・大文字小文字を区別しない
    ・? の有無を許容
    ・余分な空白を無視
    ・単語間の空白数を無視
    ・軽微なスペルミスを許容
    ・日本語のみの回答は不正解
*/
submitInputButton.addEventListener("click", function() {
    checkInputAnswer();
});


answerInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        checkInputAnswer();
    }
});


function normalizeInput(text) {

    return text
        .trim()
        .toLowerCase()
        .replace(/[?？]/g, "")
        .replace(/\s+/g, " ")
        .replace(/[^a-z\s]/g, "")
        .trim();
}


function levenshteinDistance(a, b) {

    const matrix = [];

    for (let i = 0; i <= b.length; i++) {
        matrix[i] = [i];
    }

    for (let j = 0; j <= a.length; j++) {
        matrix[0][j] = j;
    }

    for (let i = 1; i <= b.length; i++) {

        for (let j = 1; j <= a.length; j++) {

            if (b.charAt(i - 1) === a.charAt(j - 1)) {

                matrix[i][j] = matrix[i - 1][j - 1];

            } else {

                matrix[i][j] = Math.min(
                    matrix[i - 1][j] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j - 1] + 1
                );
            }
        }
    }

    return matrix[b.length][a.length];
}


function isFlexibleCorrectInput(input) {

    const normalized = normalizeInput(input);
    const correct = "will you marry me";

    /* 空欄は不正解 */
    if (!normalized) {
        return false;
    }

    /*
        英語として入力されているか確認。
        日本語のみの回答などはここで不正解。
    */
    if (!/[a-z]/.test(normalized)) {
        return false;
    }

    /*
        単語を分割して確認。
        "will you marry me" を基本形とする。
    */
    const words = normalized.split(" ");

    if (words.length !== 4) {
        return false;
    }

    const correctWords = ["will", "you", "marry", "me"];

    let totalDistance = 0;

    for (let i = 0; i < 4; i++) {

        const word = words[i];
        const correctWord = correctWords[i];

        const distance = levenshteinDistance(word, correctWord);

        /*
            各単語について軽微なスペルミスのみ許容。
            1文字程度の誤入力を基本的に許容する。
        */
        if (distance > 1) {
            return false;
        }

        totalDistance += distance;
    }

    /*
        全体でも大きく異なる文章になっていないことを確認。
    */
    const fullDistance =
        levenshteinDistance(normalized, correct);

    return totalDistance <= 2 && fullDistance <= 3;
}


function checkInputAnswer() {

    if (answered) {
        return;
    }

    const data = quizData[currentQuestion];
    const userAnswer = answerInput.value;

    const isCorrect = isFlexibleCorrectInput(userAnswer);

    finishAnswer(isCorrect, data);
}


/* ==========================================
   回答後の表示
========================================== */

function finishAnswer(isCorrect, data) {

    answered = true;

    if (isCorrect) {
        score++;
    }

    /* 選択肢・入力欄を操作不可にする */
    const choiceButtons =
        choices.querySelectorAll(".choice-button");

    choiceButtons.forEach(function(button) {
        button.disabled = true;
    });

    answerInput.disabled = true;
    submitInputButton.disabled = true;

    /* 正解／不正解 */
    if (isCorrect) {

        resultStatus.className =
            "result-status correct";

        resultStatus.textContent =
            "✅ 正解：" + data.displayAnswer;

    } else {

        resultStatus.className =
            "result-status incorrect";

        resultStatus.textContent =
            "❌ 不正解　正解：" + data.displayAnswer;
    }

    /* 問題に対応した画像 */
    answerImage.style.display = "none";
    answerImage.removeAttribute("src");

    /*
        画像読み込み成功時のみ表示。
        存在しない場合でもレイアウトが崩れないようにする。
    */
    answerImage.onload = function() {
        answerImage.style.display = "block";
    };

    answerImage.onerror = function() {
        answerImage.style.display = "none";
        answerImage.removeAttribute("src");
    };

    answerImage.src = data.image;

    /* 解説 */
    explanation.textContent = data.explanation;

    /* 最終問題ならボタン文言を変更 */
    if (currentQuestion === quizData.length - 1) {
        nextButton.textContent = "結果を見る";
    } else {
        nextButton.textContent = "次へ";
    }

    answerResult.style.display = "block";

    /* 回答後画面の上部へ軽く移動 */
    setTimeout(function() {
        answerResult.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }, 80);
}


/* ==========================================
   次へ
========================================== */

nextButton.addEventListener("click", function() {

    if (!answered) {
        return;
    }

    if (currentQuestion < quizData.length - 1) {

        currentQuestion++;

        displayQuestion();

        quizScreen.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    } else {

        displayResult();
    }
});


/* ==========================================
   結果表示
========================================== */

function displayResult() {

    showScreen(resultScreen);

    scoreNumber.textContent = score;

    /* 10問正解時はクイズを完了し、披露宴へ戻るボタンに変更 */
    if (score === 10) {
        retryButton.textContent = "それでは、披露宴をお楽しみください！";
    } else {
        retryButton.textContent = "もう一度遊ぶ";
    }

    /* special.pngは10問正解時のみ表示 */
    specialImage.style.display = "none";

    if (score === 10) {

        resultTitle.textContent = "👑 コンプリート達成";

        resultMessage.textContent =
            "全問正解おめでとうございます！\n\n" +
            "会場内に散りばめられた私たちの好きなものや思い出、こだわりを見つけていただきありがとうございました。\n\n" +
            "少しでもこの結婚式を楽しんでいただけていたら嬉しいです。";

        specialImage.onload = function() {
            specialImage.style.display = "block";
        };

        specialImage.onerror = function() {
            specialImage.style.display = "none";
        };

        specialImage.src = "special.png";

    } else if (score >= 7) {

        resultTitle.textContent = "✨ あと一歩";

        resultMessage.textContent =
            "素晴らしい観察力です。\n\n" +
            "会場に隠された思い出やこだわりを、ほとんど見つけられているようです。\n\n" +
            "コンプリートまでもう少し！";

    } else if (score >= 4) {

        resultTitle.textContent = "📍 発見中";

        resultMessage.textContent =
            "会場に散りばめられたこだわりに気付き始めています。\n\n" +
            "行き詰まったらヒントも活用しながら、ぜひ探索を続けてみてください。";

    } else {

        resultTitle.textContent = "🔍 探索中";

        resultMessage.textContent =
            "まだ見つけられていないヒントがあるかもしれません。\n\n" +
            "会場を少し見渡してみると、新しい発見があるかも？";
    }
}


/* ==========================================
   もう一度遊ぶ
   ページ再読み込みはせず、
   注意画面へ戻って最初から開始
========================================== */

retryButton.addEventListener("click", function() {

    currentQuestion = 0;
    score = 0;
    answered = false;

    answerInput.value = "";
    answerInput.disabled = false;
    submitInputButton.disabled = false;

    specialImage.style.display = "none";

    showScreen(noticeScreen);
});
</script>
